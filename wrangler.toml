name = "thinkstorm"
main = "src/worker.js"
compatibility_date = "2026-05-29"
compatibility_flags = ["nodejs_compat"]

[vars]
GEMINI_FLASH_MODEL = "gemini-3.1-flash-lite"
GEMINI_PRO_MODEL = "gemini-3.5-flash"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]
